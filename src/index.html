<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poker Card </title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-success">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="bg-white shadow rounded position-relative d-flex justify-content-center align-items-center"
      style="width: min(70vw, 350px); aspect-ratio: 7/10;">


      <div id="arriba" class="position-absolute top-0 start-0 m-3 fs-1 text-danger">
        ♥
      </div>


      <div id="medio" class="position-absolute top-50 start-50 translate-middle display-1">
        3
      </div>


      <div id="abajo" class="position-absolute bottom-0 end-0 m-3 fs-1 text-danger" style="transform: rotate(180deg);">
        ♥
      </div>

    </div>
    <button type="button" id="boton" class="btn btn-danger m-3">Cambiazo!</button>
  </div>
 <script type="text/javascript" src="app.js"></script>
</body>
 
</html>
